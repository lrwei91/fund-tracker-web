<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>持仓浮窗 · 恭喜发财</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fdfdfa; color: #1a1a1a;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { position: sticky; top: 0; display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; background: #1a1a1a; color: #ffe28a; font-size: 13px; letter-spacing: 1px; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #4cd6a0; }
  header .dot.stale { background: #ffe28a; }
  header .dot.unavailable { background: #ff7c8b; }
  header .time { margin-left: auto; color: #bbb; font-size: 11px; letter-spacing: 0; }
  .row { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #eee; cursor: pointer; }
  .row:hover { background: #fffbe8; }
  .row .name { font-size: 14px; font-weight: 600; }
  .row .code { font-size: 11px; color: #999; }
  .row .price { margin-left: auto; font-size: 15px; font-variant-numeric: tabular-nums; }
  .row .pct { width: 74px; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
  .up { color: #c0272d; }
  .down { color: #137a55; }
  .flat { color: #888; }
  .empty { padding: 28px 14px; color: #888; font-size: 13px; text-align: center; line-height: 1.7; }
</style>
</head>
<body>
<header><span class="dot unavailable" id="dot"></span>持仓浮窗<span class="time" id="time"></span></header>
<div id="list"></div>
<div class="empty" id="empty">等待主窗口同步行情…<br>请保持主窗口打开</div>
<script>
(function () {
  var list = document.getElementById('list');
  var empty = document.getElementById('empty');
  var dot = document.getElementById('dot');
  var timeEl = document.getElementById('time');
  var channel = null;
  try { channel = new BroadcastChannel('ft-holding-widget'); } catch (e) { /* ignore */ }

  function pctClass(v) { return v > 0 ? 'up' : v < 0 ? 'down' : 'flat'; }
  function fmtPct(v) {
    if (v == null || !isFinite(Number(v))) return '--';
    var n = Number(v);
    return (n > 0 ? '+' : '') + n.toFixed(2) + '%';
  }
  function render(state) {
    var quotes = (state && state.quotes) || {};
    var codes = Object.keys(quotes);
    dot.className = 'dot ' + (state && state.status ? state.status : 'unavailable');
    timeEl.textContent = state && state.updatedAt ? String(state.updatedAt).slice(11, 19) : '';
    list.innerHTML = '';
    empty.style.display = codes.length ? 'none' : 'block';
    codes.forEach(function (code) {
      var q = quotes[code];
      var row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<span class="name"></span><span class="code"></span>'
        + '<span class="price"></span><span class="pct"></span>';
      row.querySelector('.name').textContent = q.name || code;
      row.querySelector('.code').textContent = code;
      row.querySelector('.price').textContent = q.price != null ? q.price : '--';
      var pct = row.querySelector('.pct');
      pct.textContent = fmtPct(q.changePercent);
      pct.className = 'pct ' + pctClass(q.changePercent);
      row.addEventListener('click', function () {
        if (channel) channel.postMessage({ type: 'open-detail', code: code });
      });
      list.appendChild(row);
    });
  }
  try { render(JSON.parse(localStorage.getItem('ft_holding_widget_state') || 'null')); } catch (e) { render(null); }
  if (channel) {
    channel.onmessage = function (message) {
      var data = message.data || {};
      if (data.type === 'holding-state') render(data.state);
    };
  }
  function notifyVisibility() {
    if (channel) channel.postMessage({ type: 'visibility', visible: document.visibilityState !== 'hidden' && !document.hidden });
  }
  document.addEventListener('visibilitychange', notifyVisibility);
  window.addEventListener('focus', notifyVisibility);
  window.addEventListener('beforeunload', function () {
    if (channel) channel.postMessage({ type: 'visibility', visible: false });
  });
  notifyVisibility();
})();
</script>
</body>
</html>
